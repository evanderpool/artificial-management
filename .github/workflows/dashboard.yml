name: Build & Deploy Ops Dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily rebuild so the heartbeat staleness count stays current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the heartbeat reads real commit dates
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integrity audit (report only — not yet blocking)
        run: node scripts/audit.js
      - name: Generate dashboard
        run: node dashboard/build.js
      - name: Stage public files only (defense in depth — never ship private/)
        run: |
          mkdir -p _site
          cp dashboard/index.html _site/
          if [ -d dashboard/projects ]; then cp -r dashboard/projects _site/projects; fi
          if [ -d dashboard/assets ]; then cp -r dashboard/assets _site/assets; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
