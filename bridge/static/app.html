<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Artificial Management — Mobile Ops</title>
<!-- same stylesheet the dashboard is built from (generated by dashboard/build.js) -->
<link rel="stylesheet" href="/shared.css">
<style>
/* mobile-only adjustments on top of the shared design system */
html,body{overflow-x:hidden}
.wrap{padding:16px 14px 56px;max-width:720px}
.grid{grid-template-columns:1fr}
.metrics{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.metric .v{font-size:20px}
header{margin-bottom:12px}
h1{font-size:17px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 14px}
.actions.one{grid-template-columns:1fr}
button{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);border-radius:8px;
  padding:11px 10px;font:600 13px "Segoe UI",system-ui;cursor:pointer;width:100%;
  min-width:0;overflow-wrap:anywhere}
button.secondary{background:transparent;color:var(--dim);border-color:var(--line)}
button.danger{background:color-mix(in srgb,var(--crit) 13%,transparent);color:var(--crit);
  border-color:color-mix(in srgb,var(--crit) 38%,transparent)}
button:active{transform:scale(.98)}
input,select,textarea{width:100%;max-width:100%;background:var(--panel-2);color:var(--text);
  border:1px solid var(--line);border-radius:8px;padding:10px;
  font:14px "Segoe UI",system-ui;margin:5px 0}
textarea{min-height:62px;resize:vertical}
.field{padding:0 16px}
.field label{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.11em;
  font-family:"Cascadia Code",Consolas,ui-monospace,monospace}
.q-item{border-bottom:1px solid var(--line);padding:10px 16px;font-size:13px}
.q-item:last-child{border-bottom:none}
.q-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.q-sum{color:var(--dim);margin-top:4px;line-height:1.45}
.q-wait{color:var(--warn);margin-top:4px;font-size:12.5px}
.q-question{margin-top:8px;padding:9px 10px;border-left:3px solid var(--info);
  background:color-mix(in srgb,var(--info) 8%,transparent);border-radius:0 6px 6px 0}
.rowbtns{display:flex;gap:8px;margin-top:8px}
.rowbtns button{width:auto;padding:6px 12px;font-size:12px}
.hide{display:none}
.toast{position:fixed;left:12px;right:12px;bottom:12px;background:var(--panel-2);
  border:1px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:13.5px;z-index:9;
  box-shadow:0 10px 34px -10px rgba(0,0,0,.7)}
</style>
</head>
<body>
<main class="wrap">

<header>
  <div>
    <div class="eyebrow">Mobile ops · live control over Tailscale</div>
    <h1>Artificial Management <span class="co">// AI Operating System</span></h1>
  </div>
</header>

<div class="card" id="keyCard">
  <h2>Access key</h2>
  <div class="field" style="padding-bottom:12px">
    <input id="keyInput" type="password" placeholder="paste the key shown on the PC">
    <button onclick="saveKey()">Unlock</button>
  </div>
</div>

<div id="main" class="hide">

  <div class="heartbeat" id="hb">
    <span class="hb-label" id="hbLabel">…</span>
    <div>
      <div id="hbText">checking session…</div>
      <div class="hb-detail" id="hbDetail"></div>
    </div>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="card">
    <h2>Project <small class="dim" id="projMeta"></small></h2>
    <div class="field" style="padding-bottom:8px"><select id="proj" onchange="renderProject()"></select></div>
    <div class="actions">
      <button onclick="act('proceed')">▶ Proceed — next step</button>
      <button class="secondary" onclick="act('project_status')">Where are we?</button>
    </div>
    <div id="projDetail"></div>
  </div>

  <div class="card">
    <h2>Tasks</h2>
    <div class="field">
      <label>Task</label>
      <input id="taskText" placeholder="what needs doing (or text to match for complete)">
      <label>Owner / due</label>
      <input id="taskOwner" placeholder="owner — default Erick">
      <input id="taskDue" type="date">
    </div>
    <div class="actions">
      <button onclick="addTask()">Add task</button>
      <button class="secondary" onclick="completeTask()">Mark complete</button>
    </div>
  </div>

  <div class="card">
    <h2>Capture</h2>
    <div class="field">
      <textarea id="capText" placeholder="note, idea, or decision — tap the mic key to dictate"></textarea>
    </div>
    <div class="actions">
      <button onclick="capture('add_note')">Save note</button>
      <button class="secondary" onclick="capture('capture_idea')">Save idea</button>
    </div>
    <div class="actions one" style="padding-top:0">
      <button class="secondary" onclick="logDecision()">Log as decision</button>
    </div>
  </div>

  <div class="card">
    <h2>System</h2>
    <div class="actions">
      <button class="secondary" onclick="act('run_brief')">Run daily brief</button>
      <button class="secondary" onclick="post('/api/rebuild',{}).then(toastR)">Rebuild dashboard</button>
      <button class="secondary" onclick="location.href='/index.html'">Open full dashboard</button>
      <button class="danger" id="pauseBtn" onclick="togglePause()">Pause bridge</button>
    </div>
  </div>

  <div class="card">
    <h2>Activity <small class="dim" id="qMeta"></small></h2>
    <div id="queue"><p class="dim" style="padding:10px 16px">Nothing queued.</p></div>
  </div>

</div>

<div id="toast" class="toast hide"></div>

<script>
"use strict";
var KEY = localStorage.getItem("ea_bridge_key") || "";
var PROJECTS = [], WATCHER = {state:"unknown"}, paused = false;

function headers(){return {"Content-Type":"application/json","X-App-Key":KEY};}
function get(p){return fetch(p,{headers:headers()}).then(function(r){return r.json();})
  .catch(function(){return {ok:false,error:"PC unreachable"};});}
function post(p,b){return fetch(p,{method:"POST",headers:headers(),body:JSON.stringify(b||{})})
  .then(function(r){return r.json();}).catch(function(){return {ok:false,error:"PC unreachable"};});}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function uuid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.remove("hide");
  setTimeout(function(){t.classList.add("hide");},3800);}
function toastR(r){toast(r.summary||r.error||"done");refresh();}
function saveKey(){KEY=document.getElementById("keyInput").value.trim();
  localStorage.setItem("ea_bridge_key",KEY);boot();}

function currentProject(){var s=document.getElementById("proj");return s?s.value:"";}
function projObj(){var n=currentProject();
  for(var i=0;i<PROJECTS.length;i++){if(PROJECTS[i].name===n)return PROJECTS[i];}return null;}

function renderProject(){
  var p=projObj();var d=document.getElementById("projDetail");
  document.getElementById("projMeta").textContent=p?p.status:"";
  d.innerHTML=p?'<div class="field" style="padding-bottom:12px"><a href="projects/'+
    esc(p.id)+'.html">open full project dashboard →</a></div>':"";
}

function act(type){
  post("/api/action",{type:type,project:currentProject(),uuid:uuid()}).then(function(r){
    if(r.id)toast("Sent to the desktop session — watch Activity below");else toastR(r);refresh();});
}
function addTask(){
  var t=document.getElementById("taskText").value.trim();if(!t)return toast("type a task first");
  post("/api/action",{type:"add_task",project:currentProject(),task:t,
    owner:document.getElementById("taskOwner").value,due:document.getElementById("taskDue").value,
    uuid:uuid()}).then(function(r){document.getElementById("taskText").value="";toastR(r);});
}
function completeTask(){
  var t=document.getElementById("taskText").value.trim();if(!t)return toast("type part of the task text");
  post("/api/action",{type:"complete_task",project:currentProject(),task:t,uuid:uuid()})
    .then(function(r){toast(r.resolved?("Completed: "+r.resolved):(r.summary||r.error));refresh();});
}
function capture(type){
  var t=document.getElementById("capText").value.trim();if(!t)return toast("nothing to save");
  post("/api/action",{type:type,project:currentProject(),text:t,uuid:uuid()})
    .then(function(r){document.getElementById("capText").value="";toastR(r);});
}
function logDecision(){
  var t=document.getElementById("capText").value.trim();if(!t)return toast("nothing to log");
  post("/api/action",{type:"log_decision",decision:t,reasoning:"",uuid:uuid()})
    .then(function(r){document.getElementById("capText").value="";toastR(r);});
}
function togglePause(){post(paused?"/api/resume":"/api/pause").then(toastR);}
function cancelReq(id){post("/api/cancel",{id:id}).then(toastR);}
function answer(id){
  var el=document.getElementById("ans-"+id);if(!el)return;var t=el.value.trim();if(!t)return;
  post("/api/answer",{thread:id,answer_to:id,text:t,project:currentProject()}).then(toastR);
}

function renderQueue(items){
  var el=document.getElementById("queue");
  var meta=document.getElementById("qMeta");
  var pend=items.filter(function(i){return i.state==="queued";}).length;
  meta.textContent=pend?(pend+" waiting"):"";
  if(!items.length){el.innerHTML='<p class="dim" style="padding:10px 16px">Nothing queued.</p>';return;}
  el.innerHTML=items.slice(-10).reverse().map(function(i){
    var cls=i.state==="done"?"pill-good":i.state==="queued"?"pill-warn":
      i.state==="question"?"pill-info":i.state==="stale"?"pill-muted":"pill-crit";
    var h='<div class="q-item"><div class="q-head"><span>'+esc(i.action)+
      (i.project?' <span class="dim">· '+esc(i.project)+"</span>":"")+
      '</span><span class="pill '+cls+'">'+esc(i.state)+"</span></div>";
    if(i.state==="queued"){
      h+='<div class="q-wait">'+(WATCHER.state==="live"
        ? "waiting for the desktop session to pick it up…"
        : "the desktop session is not listening — this will wait until it is")+"</div>";
      h+='<div class="rowbtns"><button class="secondary" onclick="cancelReq(\''+
        esc(i.id)+'\')">Cancel</button></div>';
    }
    if(i.summary)h+='<div class="q-sum">'+esc(i.summary)+"</div>";
    if(i.state==="question"&&i.question){
      h+='<div class="q-question">'+esc(i.question)+
        '<input id="ans-'+esc(i.id)+'" placeholder="your answer (mic key works)">'+
        '<div class="rowbtns"><button onclick="answer(\''+esc(i.id)+'\')">Send answer</button></div></div>';
    }
    return h+"</div>";}).join("");
}

function renderMetrics(h){
  var counts={};PROJECTS.forEach(function(p){counts[p.status]=(counts[p.status]||0)+1;});
  var sub=Object.keys(counts).map(function(k){return counts[k]+" "+k;}).join(" · ");
  var w=WATCHER.state==="live"?"listening":WATCHER.state==="stale"?"lagging":"not listening";
  document.getElementById("metrics").innerHTML=
    '<div class="metric"><div class="v">'+PROJECTS.length+'</div><div class="k">Projects</div>'+
      '<div class="s">'+esc(sub||"none")+'</div></div>'+
    '<div class="metric"><div class="v">'+(h.pending||0)+'</div><div class="k">Waiting</div>'+
      '<div class="s">queued for the session</div></div>'+
    '<div class="metric"><div class="v" style="font-size:15px;padding-top:6px">'+w+'</div>'+
      '<div class="k">Session</div><div class="s">'+
      (WATCHER.age_s!=null?("heartbeat "+WATCHER.age_s+"s ago"):"no heartbeat")+'</div></div>';
}

function refresh(){
  get("/api/health").then(function(h){
    paused=!!h.paused;WATCHER=h.watcher||{state:"unknown"};
    var hb=document.getElementById("hb");
    var live=WATCHER.state==="live";
    hb.className="heartbeat "+(h.error?"crit":live?"good":WATCHER.state==="stale"?"warn":"crit");
    document.getElementById("hbLabel").textContent=h.error?"● OFFLINE":live?"● LIVE":
      WATCHER.state==="stale"?"● LAGGING":"● NO SESSION";
    document.getElementById("hbText").textContent=h.error?"PC unreachable — is it awake and on Tailscale?":
      live?"Desktop session is listening — actions run now":
      "Bridge is up, but no Claude session is draining requests";
    document.getElementById("hbDetail").textContent=paused?"Bridge PAUSED — new requests rejected":
      (live?"Instant actions (tasks, notes, decisions) always work.":
       "Instant actions still work; Proceed / brief will wait in the queue.");
    document.getElementById("pauseBtn").textContent=paused?"Resume bridge":"Pause bridge";
    renderMetrics(h);
  });
  get("/api/queue").then(function(q){if(q.items)renderQueue(q.items);});
}

function boot(){
  if(!KEY)return;
  document.getElementById("keyCard").classList.add("hide");
  document.getElementById("main").classList.remove("hide");
  get("/api/projects").then(function(p){
    PROJECTS=(p.projects||[]);
    document.getElementById("proj").innerHTML=PROJECTS.map(function(x){
      return '<option value="'+esc(x.name)+'">'+esc(x.name)+"</option>";}).join("")
      ||'<option value="">(no projects registered)</option>';
    renderProject();
  });
  refresh();setInterval(refresh,6000);
}
boot();
</script>
</body>
</html>
